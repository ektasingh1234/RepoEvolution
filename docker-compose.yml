services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repoevolution-backend
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEFAULT_GEMINI_MODEL=${DEFAULT_GEMINI_MODEL:-gemini-2.5-flash}
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repoevolution-frontend
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEFAULT_GEMINI_MODEL=${DEFAULT_GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
